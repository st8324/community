# 공통 설정. 시크릿 값은 절대 여기에 쓰지 않는다 (환경변수로 주입, 02 문서 5.5절).
spring:
  application:
    name: community
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway SQL로만
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    resources:
      add-mappings: false # 정적 파일은 SpaForwardingConfig 한 곳에서 처리한다 (02 T-18)

server:
  error: # SEC-10: 오류 응답에 내부 정보 노출 금지
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

community:
  jwt:
    # SEC-04: Base64로 인코딩한 32바이트 이상 무작위 값. 값은 환경변수로만 넣는다 (예: openssl rand -base64 32).
    # 비어 있으면 앱이 기동하지 않는다. 테스트는 RandomJwtSecretInitializer가 무작위로 채운다.
    secret: ${JWT_SECRET:}
    ttl: 1h # A-5. 토큰 exp와 쿠키 Max-Age에 같이 쓴다
  refresh:
    ttl: 14d # A-7. 로그인 상태 유지 기간 (최초 로그인 기준 절대 만료)

management:
  endpoints:
    web:
      exposure:
        include: health # DEP-04: health 외 actuator 비노출
  endpoint:
    health:
      show-details: never
      show-components: never

---
spring:
  config:
    activate:
      on-profile: local
  datasource: # docker-compose.yml의 로컬 MySQL. 값은 .env → 환경변수로 주입
    url: jdbc:mysql://127.0.0.1:3306/community
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
