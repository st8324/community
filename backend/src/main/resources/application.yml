# 공통 설정. 시크릿 값은 절대 여기에 쓰지 않는다 (환경변수로 주입, 02 문서 5.5절).
spring:
  application:
    name: community
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway SQL로만
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  error: # SEC-10: 오류 응답에 내부 정보 노출 금지
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health # DEP-04: health 외 actuator 비노출
  endpoint:
    health:
      show-details: never
      show-components: never

---
spring:
  config:
    activate:
      on-profile: local
  datasource: # docker-compose.yml의 로컬 MySQL. 값은 .env → 환경변수로 주입
    url: jdbc:mysql://127.0.0.1:3306/community
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
